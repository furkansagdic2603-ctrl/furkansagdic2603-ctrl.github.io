name: Inspect Metafizik payload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-metafizik-payload.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metafizik-word-exact-import-20261031
      - name: Verify exact Word payload
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,io,tarfile,json,hashlib
          p=Path('.site-payload/metafizik-word-exact')
          parts=sorted(p.glob('part-*'))
          s=''.join(x.read_text() for x in parts)
          print('PARTS',len(parts),'B64_LEN',len(s),'SHA256',hashlib.sha256(s.encode()).hexdigest())
          raw=lzma.decompress(base64.b64decode(s))
          print('TAR_BYTES',len(raw))
          tf=tarfile.open(fileobj=io.BytesIO(raw),mode='r:')
          names=tf.getnames()
          print('TAR_NAMES',names)
          manifest=json.loads(tf.extractfile('manifest.json').read())
          print('MANIFEST_COUNT',len(manifest))
          for slug,meta in manifest.items():
              data=tf.extractfile(slug+'.html').read()
              print('ITEM',slug,'BYTES',len(data),'HAS_FONT_COLOR',b'<font color=' in data,'HAS_BOLD',b'<b>' in data)
          PY
