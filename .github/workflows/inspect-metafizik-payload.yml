name: Inspect Metafizik payload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-metafizik-payload.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect complete payload
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,io,tarfile
          p=Path('.site-payload/metafizik-20261031')
          names=[f'part-{i:02d}' for i in range(12)]+['part-12a','part-12b','part-12c']
          s=''.join((p/n).read_text() for n in names)
          for n in ['part-13h0','part-13h1','part-14h0','part-14h1','part-15h1']:
              s += bytes.fromhex((p/n).read_text().strip()).decode('ascii')
          s=''.join(s.split())
          print('B64_LEN_BEFORE_PADDING',len(s),'MOD4',len(s)%4)
          s += '='*((4-len(s)%4)%4)
          raw=base64.b64decode(s,validate=True)
          print('XZ_LEN',len(raw),'HEAD',raw[:16])
          out=lzma.decompress(raw)
          print('OUT_LEN',len(out),'HEAD',repr(out[:300]))
          try:
              tf=tarfile.open(fileobj=io.BytesIO(out),mode='r:*')
              print('TAR_NAMES',tf.getnames())
          except Exception as e:
              print('NOT_TAR',type(e).__name__,str(e))
          PY
