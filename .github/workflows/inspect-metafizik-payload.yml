name: Inspect Metafizik payload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-metafizik-payload.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect complete payload
        shell: bash
        run: |
          set -euxo pipefail
          P=.site-payload/metafizik-20261031
          cat "$P"/part-00 "$P"/part-01 "$P"/part-02 "$P"/part-03 "$P"/part-04 "$P"/part-05 "$P"/part-06 "$P"/part-07 "$P"/part-08 "$P"/part-09 "$P"/part-10 "$P"/part-11 "$P"/part-12a "$P"/part-12b "$P"/part-12c > /tmp/payload.b64
          for F in part-13h0 part-13h1 part-14h0 part-14h1 part-15h1; do
            xxd -r -p "$P/$F" >> /tmp/payload.b64
          done
          tr -d '\r\n ' < /tmp/payload.b64 > /tmp/payload.clean.b64
          base64 -d /tmp/payload.clean.b64 > /tmp/payload.xz
          echo "=== COMPRESSED ==="
          file /tmp/payload.xz
          wc -c /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload.out
          echo "=== DECOMPRESSED ==="
          file /tmp/payload.out
          wc -c /tmp/payload.out
          head -c 400 /tmp/payload.out | xxd
          echo "=== TAR LIST IF TAR ==="
          (tar -tf /tmp/payload.out | head -100) || true
