<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yazı Defteri | Furkan Sağdıç</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        .editor-wrap {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .editor-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px;
            background: var(--bg-yumusak);
            border: 1px solid var(--cizgi);
            border-radius: 10px 10px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .editor-bar button {
            background: var(--bg);
            border: 1px solid var(--cizgi);
            color: var(--metin);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            min-width: 36px;
        }

        .editor-bar button:hover {
            background: var(--baslik);
            color: white;
        }

        .editor-bar select {
            background: var(--bg);
            border: 1px solid var(--cizgi);
            color: var(--metin);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .editor-bar .ayrac {
            width: 1px;
            background: var(--cizgi);
            margin: 4px 6px;
        }

        .editor-bar .renk-grup {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .editor-bar input[type="color"] {
            width: 40px;
            height: 36px;
            border: 1px solid var(--cizgi);
            border-radius: 6px;
            cursor: pointer;
            padding: 2px;
        }

        .form-alan {
            background: var(--bg);
            border: 1px solid var(--cizgi);
            border-top: none;
            padding: 20px;
        }

        .form-alan label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--baslik);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-alan input[type="text"],
        .form-alan select,
        .form-alan textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--cizgi);
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            background: var(--bg);
            color: var(--metin);
            margin-bottom: 16px;
        }

        .form-alan textarea {
            resize: vertical;
            min-height: 60px;
        }

        .satir {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        #editor {
            background: white;
            color: #1a1a1a;
            border: 1px solid var(--cizgi);
            border-radius: 0 0 10px 10px;
            padding: 40px 50px;
            min-height: 600px;
            font-family: Georgia, serif;
            font-size: 18px;
            line-height: 1.8;
            outline: none;
        }

        #editor:focus {
            border-color: var(--vurgu);
        }

        #editor h2 {
            font-size: 26px;
            color: #1e3a5f;
            margin: 30px 0 15px;
        }

        #editor h3 {
            font-size: 21px;
            color: #2b6cb0;
            margin: 25px 0 12px;
        }

        #editor blockquote {
            margin: 20px 0;
            padding: 15px 20px;
            background: #f0f4f8;
            border-left: 4px solid #4a6fa5;
            font-style: italic;
        }

        #editor img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            cursor: pointer;
        }

        #editor img.secili {
            outline: 3px solid #2b6cb0;
            outline-offset: 2px;
        }

        .butonlar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .buton {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .buton-indir {
            background: var(--baslik);
            color: white;
        }

        .buton-indir:hover {
            background: var(--baslik-acik);
        }

        .buton-temizle {
            background: var(--bg-yumusak);
            color: var(--metin);
            border: 1px solid var(--cizgi);
        }

        .durum {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .durum.basari {
            background: #e6f4ea;
            color: #1e5e2e;
            display: block;
        }

        @media (max-width: 700px) {
            .satir { grid-template-columns: 1fr; }
            #editor { padding: 20px 25px; font-size: 16px; }
            .editor-bar { gap: 4px; padding: 8px; }
            .editor-bar button { padding: 6px 10px; font-size: 13px; }
        }

    </style>

</head>

<body>

<header class="ust-bar">

    <div class="ust-bar-ic">

        <a href="../index.html" class="site-baslik">
            Furkan Sağdıç
        </a>

        <div class="ust-bar-sag">

            <a href="../index.html" style="color: var(--vurgu); font-size: 14px; font-weight: 600; text-decoration: none;">
                ← Siteye dön
            </a>

        </div>

    </div>

</header>



<main>

    <div class="editor-wrap">


        <!-- ============ ARAÇ ÇUBUĞU ============ -->

        <div class="editor-bar">

            <button onclick="komut('bold')" title="Kalın"><b>B</b></button>
            <button onclick="komut('italic')" title="İtalik"><i>I</i></button>
            <button onclick="komut('underline')" title="Altı çizili"><u>U</u></button>
            <button onclick="komut('strikeThrough')" title="Üstü çizili"><s>S</s></button>

            <span class="ayrac"></span>

            <select onchange="baslikVer(this.value)" title="Başlık">
                <option value="">Başlık</option>
                <option value="h2">Büyük Başlık</option>
                <option value="h3">Küçük Başlık</option>
                <option value="p">Normal Paragraf</option>
                <option value="blockquote">Alıntı</option>
            </select>

            <select onchange="boyutVer(this.value)" title="Yazı Boyutu">
                <option value="">Boyut</option>
                <option value="14px">14</option>
                <option value="16px">16</option>
                <option value="18px">18</option>
                <option value="20px">20</option>
                <option value="24px">24</option>
                <option value="28px">28</option>
                <option value="32px">32</option>
                <option value="40px">40</option>
            </select>

            <select onchange="fontVer(this.value)" title="Yazı Tipi">
                <option value="">Yazı Tipi</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="'Courier New', monospace">Courier New</option>
            </select>

            <span class="ayrac"></span>

            <div class="renk-grup">
                <button onclick="renkVer()" title="Yazı Rengi">A</button>
                <input type="color" id="renkSec" value="#1a1a1a" onchange="renkVer(this.value)" title="Yazı Rengi">
            </div>

            <div class="renk-grup">
                <button onclick="vurguVer()" title="Vurgu Rengi">ab</button>
                <input type="color" id="vurguSec" value="#FEF08A" onchange="vurguVer(this.value)" title="Vurgu Rengi">
            </div>

            <span class="ayrac"></span>

            <button onclick="komut('justifyLeft')" title="Sola hizala">⬅</button>
            <button onclick="komut('justifyCenter')" title="Ortala">⬌</button>
            <button onclick="komut('justifyRight')" title="Sağa hizala">➡</button>

            <span class="ayrac"></span>

            <button onclick="komut('insertUnorderedList')" title="Madde listesi">•</button>
            <button onclick="komut('insertOrderedList')" title="Numaralı liste">1.</button>

            <span class="ayrac"></span>

            <button onclick="baglantiEkle()" title="Bağlantı">🔗</button>
            <button onclick="resimEkle()" title="Resim Ekle">🖼</button>
            <button onclick="komut('insertHorizontalRule')" title="Çizgi">—</button>
            <button onclick="komut('removeFormat')" title="Biçimi temizle">Tx</button>

        </div>



        <!-- ============ FORM ALANI ============ -->

        <div class="form-alan">

            <label for="baslik">Yazı Başlığı</label>
            <input type="text" id="baslik" placeholder="Yazının başlığını girin...">

            <div class="satir">

                <div>
                    <label for="kategori">Kategori</label>
                    <select id="kategori">
                        <option value="felsefe">Felsefe</option>
                        <option value="edebiyat">Edebiyat</option>
                        <option value="sosyoloji">Sosyoloji</option>
                        <option value="tarih">Tarih</option>
                        <option value="psikoloji">Psikoloji</option>
                        <option value="sanat">Sanat</option>
                        <option value="din">Din</option>
                        <option value="bilim">Bilim</option>
                        <option value="mitoloji">Mitoloji</option>
                        <option value="notlar">Notlar</option>
                    </select>
                </div>

                <div>
                    <label for="altkategori">Alt Kategori</label>
                    <input type="text" id="altkategori" placeholder="Örnek: gundelik-hayat">
                </div>

            </div>

            <label for="ozet">Özet</label>
            <textarea id="ozet" placeholder="Kısa bir açıklama girin..."></textarea>

            <label for="slug">URL Adresi (küçük harf, tire ile)</label>
            <input type="text" id="slug" placeholder="ornek-yazi-adi">

        </div>



        <!-- ============ EDİTÖR ============ -->

        <div id="editor" contenteditable="true" spellcheck="true">
            <p>Buraya yazmaya başlayın...</p>
        </div>



        <!-- ============ BUTONLAR ============ -->

        <div class="butonlar">

            <button class="buton buton-indir" onclick="yayinla()">
                ⬇ HTML Dosyası Olarak İndir
            </button>

            <button class="buton buton-temizle" onclick="temizle()">
                Formu Temizle
            </button>

        </div>



        <div class="durum" id="durum"></div>


        <!-- ============ RESİM SEÇİCİ ============ -->

        <input type="file" id="resimSec" accept="image/*" style="display: none;" onchange="resmiEkle(this)">


    </div>

</main>



<footer class="alt-bilgi">

    <div class="alt-bilgi-ic">

        <p>
            © 2026 Furkan Sağdıç
        </p>

    </div>

</footer>



<script>

// =========================================================
// YAZI DEFTERİ - SCRIPT
// =========================================================

// ---- Komutları çalıştır ----
function komut(cmd, val) {
    document.execCommand(cmd, false, val || null);
    document.getElementById('editor').focus();
}

// ---- Başlık ver ----
function baslikVer(tag) {
    if (!tag) return;
    document.execCommand('formatBlock', false, '<' + tag + '>');
    document.getElementById('editor').focus();
}

// ---- Yazı boyutu ver ----
function boyutVer(px) {
    if (!px) return;

    var secim = window.getSelection();
    if (!secim.rangeCount || secim.isCollapsed) {
        alert('Önce boyutunu değiştireceğiniz metni seçin.');
        return;
    }

    document.execCommand('fontSize', false, '7');
    var fontlar = document.querySelectorAll('#editor font[size="7"]');
    for (var i = 0; i < fontlar.length; i++) {
        var span = document.createElement('span');
        span.style.fontSize = px;
        while (fontlar[i].firstChild) {
            span.appendChild(fontlar[i].firstChild);
        }
        fontlar[i].replaceWith(span);
    }
}

// ---- Yazı tipi ver ----
function fontVer(font) {
    if (!font) return;
    document.execCommand('fontName', false, font);
}

// ---- Yazı rengi ver ----
function renkVer(renk) {
    var secim = window.getSelection();
    if (!secim.rangeCount || secim.isCollapsed) {
        alert('Önce renklendireceğiniz metni seçin.');
        return;
    }
    if (!renk) {
        renk = document.getElementById('renkSec').value;
    }
    document.execCommand('foreColor', false, renk);
}

// ---- Vurgu rengi ver ----
function vurguVer(renk) {
    var secim = window.getSelection();
    if (!secim.rangeCount || secim.isCollapsed) {
        alert('Önce vurgulayacağınız metni seçin.');
        return;
    }
    if (!renk) {
        renk = document.getElementById('vurguSec').value;
    }
    document.execCommand('hiliteColor', false, renk);
}

// ---- Bağlantı ekle ----
function baglantiEkle() {
    var url = prompt('Bağlantı adresi:', 'https://');
    if (url) {
        document.execCommand('createLink', false, url);
    }
}

// ---- Resim ekle ----
function resimEkle() {
    document.getElementById('resimSec').click();
}

// ---- Resmi editöre ekle ----
function resmiEkle(input) {
    var dosya = input.files[0];
    if (!dosya) return;

    var okuyucu = new FileReader();

    okuyucu.onload = function(e) {
        var editor = document.getElementById('editor');
        var img = document.createElement('img');
        img.src = e.target.result;
        img.style.display = 'block';
        img.style.maxWidth = '100%';
        img.style.margin = '20px auto';
        img.style.borderRadius = '6px';

        // İmleç konumuna ekle
        editor.focus();
        var secim = window.getSelection();
        if (secim.rangeCount) {
            var aralik = secim.getRangeAt(0);
            aralik.deleteContents();
            aralik.insertNode(img);
            aralik.setStartAfter(img);
            aralik.collapse(true);
            secim.removeAllRanges();
            secim.addRange(aralik);
        } else {
            editor.appendChild(img);
        }
    };

    okuyucu.readAsDataURL(dosya);
    input.value = ''; // Sıfırla
}

// ---- HTML dosyası oluştur ve indir ----
function yayinla() {

    var baslik = document.getElementById('baslik').value.trim();
    var kategori = document.getElementById('kategori').value;
    var altkategori = document.getElementById('altkategori').value.trim();
    var ozet = document.getElementById('ozet').value.trim();
    var slug = document.getElementById('slug').value.trim();
    var icerik = document.getElementById('editor').innerHTML;

    if (!baslik) {
        alert('Yazı başlığını girin.');
        return;
    }

    if (!slug) {
        // Başlıktan otomatik slug oluştur
        slug = baslik.toLowerCase()
            .replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i')
            .replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
    }

    var kategoriAdi = kategori.charAt(0).toUpperCase() + kategori.slice(1);
    var altKategoriEtiket = altkategori || kategoriAdi;

    var tarih = new Date();
    var aylar = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    var tarihStr = tarih.getDate() + ' ' + aylar[tarih.getMonth()] + ' ' + tarih.getFullYear();

    // Yol hesapla
    var yol = '../../../';
    if (altkategori) {
        yol = '../../../';
    }

    var html = '<!DOCTYPE html>\n' +
'<html lang="tr">\n\n' +
'<head>\n\n' +
'    <meta charset="UTF-8">\n\n' +
'    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n\n' +
'    <title>' + baslik + ' | Furkan Sağdıç</title>\n\n' +
'    <meta name="description" content="' + ozet + '">\n\n' +
'    <link rel="stylesheet" href="../../../style.css">\n\n' +
'</head>\n\n\n' +
'<body>\n\n' +
'<header class="ust-bar">\n\n' +
'    <div class="ust-bar-ic">\n\n' +
'        <a href="../../../index.html" class="site-baslik">Furkan Sağdıç</a>\n\n' +
'        <div class="ust-bar-sag">\n\n' +
'            <div class="yazi-boyutu">\n\n' +
'                <button id="kucult" title="Yazıyı küçült">A−</button>\n\n' +
'                <button id="sifirla" title="Normal boyut">A</button>\n\n' +
'                <button id="buyut" title="Yazıyı büyüt">A+</button>\n\n' +
'            </div>\n\n' +
'            <button id="menu-buton" class="menu-buton" title="Menü">☰</button>\n\n' +
'        </div>\n\n' +
'    </div>\n\n' +
'</header>\n\n\n' +
'<nav id="ana-menu" class="ana-menu">\n\n' +
'    <div class="ana-menu-ic">\n\n' +
'        <a href="../../../index.html">Ana Sayfa</a>\n\n' +
'        <a href="../../../felsefe/index.html">Felsefe</a>\n\n' +
'        <a href="../../../edebiyat/index.html">Edebiyat</a>\n\n' +
'        <a href="../../../sosyoloji/index.html">Sosyoloji</a>\n\n' +
'        <a href="../../../tarih/index.html">Tarih</a>\n\n' +
'        <a href="../../../psikoloji/index.html">Psikoloji</a>\n\n' +
'        <a href="../../../sanat/index.html">Sanat</a>\n\n' +
'        <a href="../../../din/index.html">Din</a>\n\n' +
'        <a href="../../../bilim/index.html">Bilim</a>\n\n' +
'        <a href="../../../mitoloji/index.html">Mitoloji</a>\n\n' +
'        <a href="../../../notlar/index.html">Notlar</a>\n\n' +
'        <a href="../../../hakkimda/index.html">Hakkımda</a>\n\n' +
'    </div>\n\n' +
'</nav>\n\n\n' +
'<main>\n\n' +
'    <div class="yazi-sayfa">\n\n' +
'        <div class="kategori-etiket">' + kategoriAdi + (altkategori ? ' · ' + altKategoriEtiket : '') + '</div>\n\n' +
'        <h1 class="yazi-baslik">' + baslik + '</h1>\n\n' +
'        <div class="yazi-meta">' + tarihStr + ' · Furkan Sağdıç</div>\n\n' +
'        <article class="yazi-icerik">\n\n' +
icerik + '\n\n' +
'        </article>\n\n' +
'    </div>\n\n' +
'    <div class="geri-don">\n\n' +
'        <a href="../index.html">← ' + kategoriAdi + ' yazılarına dön</a>\n\n' +
'    </div>\n\n' +
'</main>\n\n\n' +
'<footer class="alt-bilgi">\n\n' +
'    <div class="alt-bilgi-ic">\n\n' +
'        <p>© 2026 Furkan Sağdıç</p>\n\n' +
'    </div>\n\n' +
'</footer>\n\n\n' +
'<script src="../../../script.js"><\/script>\n\n' +
'</body>\n\n' +
'</html>';

    // Dosyayı indir
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = slug + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Durum mesajı
    var durum = document.getElementById('durum');
    durum.className = 'durum basari';
    durum.innerHTML = '<strong>✓ Dosya indirildi: ' + slug + '.html</strong><br><br>' +
        'Şimdi bu dosyayı GitHub\'da şu klasöre yükleyin:<br>' +
        '<code>' + kategori + '/' + (altkategori || 'yazilar') + '/' + slug + '/index.html</code>';

}

// ---- Formu temizle ----
function temizle() {
    document.getElementById('baslik').value = '';
    document.getElementById('altkategori').value = '';
    document.getElementById('ozet').value = '';
    document.getElementById('slug').value = '';
    document.getElementById('editor').innerHTML = '<p>Buraya yazmaya başlayın...</p>';
    document.getElementById('durum').className = 'durum';
}

</script>

</body>

</html>
