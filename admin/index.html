<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yazı editörü | Furkan Sağdıç</title><link rel="stylesheet" href="/style.css"><style>.editor-shell,.login-shell{max-width:940px;margin:48px auto}.login-shell{max-width:460px}.login-shell input{display:block;width:100%;padding:11px;margin:7px 0 18px;border:1px solid #cfcac0;background:#fff;font:16px system-ui}.login-shell label{font-weight:600}.login-shell [hidden],.editor-shell[hidden]{display:none!important}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.admin-top button{border:1px solid #cfcac0;background:transparent;padding:8px 12px}.category-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0 28px}.category-tools label{flex:1;min-width:200px}.category-tools input{width:100%;padding:11px;border:1px solid #cfcac0;font:16px system-ui}.category-tools button{padding:11px;border:1px solid #8b3d2e;color:#8b3d2e;background:transparent}.editor-shell h1{font:normal 56px Georgia,serif;margin:0}.editor-shell>p{color:#666}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0}.fields label{display:block;font-size:14px;font-weight:600}.fields input,.fields select,.fields textarea{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #cfcac0;background:#fff;font:16px system-ui}.wide{grid-column:1/-1}.fields [hidden]{display:none}.toolbar{position:sticky;top:0;background:#f2eee6;border:1px solid #d8d4ca;padding:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}.toolbar button,.toolbar select,.toolbar input{border:1px solid #cfcac0;background:#fff;padding:7px;min-height:35px}.toolbar button{min-width:36px}.toolbar input[type=color]{width:43px;padding:1px}.editor{background:white;border:1px solid #d8d4ca;border-top:0;min-height:430px;padding:28px 34px;outline-color:#8b3d2e;font:18px/1.8 Georgia,serif}.editor:empty:before{content:'Yazınızı buraya yazın…';color:#aaa}.action{background:#8b3d2e;color:white;border:0;padding:13px 23px;margin:18px 0;cursor:pointer}.help{border-top:1px solid #d8d4ca;margin-top:28px;padding-top:18px}.help li{margin:8px 0}.help code{word-break:break-all}#feedback{color:#8b3d2e}@media(max-width:650px){.fields{grid-template-columns:1fr}.editor-shell h1{font-size:42px}.editor{padding:20px}}</style></head><body><header class="masthead"><div class="topline"><a class="brand" href="/">Furkan Sağdıç<span>Yazı editörü</span></a><a href="/">Siteye dön →</a></div></header><main><section class="login-shell" id="admin-login"><h1>Yönetim girişi</h1><form id="login-form"><label>E-posta<input name="email" type="email" autocomplete="username" required></label><label>Şifre<input name="password" type="password" autocomplete="current-password" required></label><button class="action" type="submit">Giriş yap</button><p id="login-feedback" role="status"></p></form></section><div class="editor-shell" id="admin-panel" hidden><div class="admin-top"><h1>Yeni yazı</h1><button id="logout" type="button">Çıkış yap</button></div><p>Yazını hazırlayıp yayımla. Yeni kategoriyi buradan açabilirsin.</p><div class="category-tools"><label>Yeni kategori adı<input id="new-category" maxlength="50" placeholder="Örn. Sinema"></label><button id="add-category" type="button">Kategori ekle</button></div><div class="fields"><label>Kategori<select id="category"><option value="kitap-notlari">Kitap Notları</option><option value="felsefe">Felsefe</option><option value="sanat">Sanat</option><option value="edebiyat">Edebiyat</option><option value="tarih">Tarih</option><option value="din">Din</option><option value="mitoloji">Mitoloji</option><option value="sosyoloji">Sosyoloji</option><option value="psikoloji">Psikoloji</option><option value="bilim">Bilim</option><option value="notlar">Notlar</option></select></label><label id="free-subcategory">Alt kategori (isteğe bağlı)<input id="subcategory" placeholder="Örn. estetik"></label><label id="book-topic-field" hidden>Kitap notunun konusu<select id="book-topic"><option value="felsefe">Felsefe</option><option value="din">Din</option><option value="tarih">Tarih</option><option value="edebiyat">Edebiyat</option><option value="sanat">Sanat</option><option value="sinema">Sinema</option><option value="sosyoloji">Sosyoloji</option><option value="psikoloji">Psikoloji</option><option value="bilim">Bilim</option><option value="mitoloji">Mitoloji</option><option value="diger">Diğer</option></select></label><label class="wide">Başlık<input id="title" required placeholder="Yazının başlığı"></label><label class="wide">Kısa açıklama<textarea id="description" rows="2" placeholder="Yazı listesinde görünecek açıklama"></textarea></label></div><div class="toolbar" aria-label="Metin biçimlendirme"><select id="block" aria-label="Paragraf biçimi"><option value="p">Paragraf</option><option value="h2">Başlık</option><option value="h3">Alt başlık</option><option value="blockquote">Alıntı</option></select><button type="button" data-command="bold" title="Kalın"><b>K</b></button><button type="button" data-command="italic" title="İtalik"><i>İ</i></button><button type="button" data-command="underline" title="Altı çizili"><u>A</u></button><button type="button" data-command="insertUnorderedList" title="Madde listesi">• Liste</button><button type="button" data-command="insertOrderedList" title="Numaralı liste">1. Liste</button><button type="button" id="link" title="Bağlantı">Bağlantı</button><button type="button" id="image" title="Görsel URL">Görsel</button><select id="size" aria-label="Yazı boyutu"><option value="3">Normal</option><option value="2">Küçük</option><option value="4">Büyük</option><option value="5">Daha büyük</option></select><label title="Metin rengi">Renk <input id="color" type="color" value="#22221e"></label><button type="button" data-command="removeFormat">Biçimi sil</button></div><div id="editor" class="editor" contenteditable="true" role="textbox" aria-label="Yazı içeriği" aria-multiline="true"></div><button id="download" hidden>HTML dosyasını indir</button><button id="publish" class="action" type="button">Yayımla</button><p id="feedback" role="status"></p></div></main><script src="/comments-config.js" defer></script><script src="/admin/editor.js" defer></script><script src="/admin/panel.js" defer></script></body></html>
