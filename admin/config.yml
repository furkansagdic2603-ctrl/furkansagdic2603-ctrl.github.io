backend:
  name: git-gateway
  branch: main

media_folder: "resimler"
public_folder: "/resimler"

# Site dilleri ve yerelleştirme
locale: "tr"

# Editör önizlemesi
editor:
  preview: true

# Koleksiyonlar (kategoriler)
collections:

  # ---- SOSYOLOJİ ----
  - name: "sosyoloji"
    label: "Sosyoloji"
    label_singular: "Sosyoloji Yazısı"
    folder: "sosyoloji/yazilar"
    create: true
    slug: "{{slug}}"
    preview_path: "sosyoloji/yazilar/{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Yayın Tarihi", name: "date", widget: "datetime", format: "DD MMMM YYYY", date_format: "DD MMMM YYYY", time_format: false}
      - {label: "Alt Kategori", name: "altkategori", widget: "string", required: false, hint: "Örneğin: gundelik-hayat"}
      - {label: "Özet", name: "ozet", widget: "text", required: false}
      - label: "Yazı Rengi"
        name: "yazi_rengi"
        widget: "select"
        options:
          - {label: "Siyah (Varsayılan)", value: "#292723"}
          - {label: "Koyu Gri", value: "#4a4a4a"}
          - {label: "Lacivert", value: "#1e3a5f"}
          - {label: "Bordo", value: "#7a2e2e"}
          - {label: "Kahverengi", value: "#5c4033"}
          - {label: "Koyu Yeşil", value: "#2f4f2f"}
        default: "#292723"
      - label: "Başlık Rengi"
        name: "baslik_rengi"
        widget: "select"
        options:
          - {label: "Lacivert (Varsayılan)", value: "#1e3a5f"}
          - {label: "Bordo", value: "#7a2e2e"}
          - {label: "Siyah", value: "#1a1a1a"}
          - {label: "Koyu Yeşil", value: "#2f4f2f"}
          - {label: "Mor", value: "#5b3a7a"}
        default: "#1e3a5f"
      - label: "Yazı Boyutu"
        name: "yazi_boyutu"
        widget: "select"
        options:
          - {label: "Küçük", value: "16px"}
          - {label: "Orta (Varsayılan)", value: "18px"}
          - {label: "Büyük", value: "20px"}
          - {label: "Çok Büyük", value: "22px"}
        default: "18px"
      - label: "Başlık Boyutu"
        name: "baslik_boyutu"
        widget: "select"
        options:
          - {label: "Küçük", value: "28px"}
          - {label: "Orta (Varsayılan)", value: "38px"}
          - {label: "Büyük", value: "46px"}
        default: "38px"
      - label: "Arka Plan Rengi"
        name: "arka_plan"
        widget: "select"
        options:
          - {label: "Beyaz (Varsayılan)", value: "#ffffff"}
          - {label: "Krem", value: "#f7f4ee"}
          - {label: "Açık Gri", value: "#f5f7fa"}
          - {label: "Çok Açık Mavi", value: "#f0f4f8"}
        default: "#ffffff"
      - {label: "İçerik", name: "body", widget: "markdown"}


  # ---- FELSEFE ----
  - name: "felsefe"
    label: "Felsefe"
    label_singular: "Felsefe Yazısı"
    folder: "felsefe/yazilar"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Yayın Tarihi", name: "date", widget: "datetime", format: "DD MMMM YYYY", date_format: "DD MMMM YYYY", time_format: false}
      - {label: "Alt Kategori", name: "altkategori", widget: "string", required: false}
      - {label: "Özet", name: "ozet", widget: "text", required: false}
      - label: "Yazı Rengi"
        name: "yazi_rengi"
        widget: "select"
        options:
          - {label: "Siyah (Varsayılan)", value: "#292723"}
          - {label: "Koyu Gri", value: "#4a4a4a"}
          - {label: "Lacivert", value: "#1e3a5f"}
          - {label: "Bordo", value: "#7a2e2e"}
          - {label: "Kahverengi", value: "#5c4033"}
        default: "#292723"
      - label: "Başlık Rengi"
        name: "baslik_rengi"
        widget: "select"
        options:
          - {label: "Lacivert (Varsayılan)", value: "#1e3a5f"}
          - {label: "Bordo", value: "#7a2e2e"}
          - {label: "Siyah", value: "#1a1a1a"}
        default: "#1e3a5f"
      - label: "Yazı Boyutu"
        name: "yazi_boyutu"
        widget: "select"
        options:
          - {label: "Küçük", value: "16px"}
          - {label: "Orta (Varsayılan)", value: "18px"}
          - {label: "Büyük", value: "20px"}
        default: "18px"
      - {label: "İçerik", name: "body", widget: "markdown"}


