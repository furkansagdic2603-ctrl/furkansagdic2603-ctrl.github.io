backend:
  name: git-gateway
  branch: main

media_folder: "resimler"
public_folder: "/resimler"

collections:

  - name: "sosyoloji"
    label: "Sosyoloji"
    folder: "sosyoloji/yazilar"
    create: true
    slug: "{{slug}}"
    extension: "html"
    path: "{{slug}}/index"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "İçerik", name: "body", widget: "code", default_language: "html"}

  - name: "tarih"
    label: "Tarih"
    folder: "tarih/yazilar"
    create: true
    slug: "{{slug}}"
    extension: "html"
    path: "{{slug}}/index"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "İçerik", name: "body", widget: "code", default_language: "html"}

  - name: "felsefe"
    label: "Felsefe"
    folder: "felsefe/yazilar"
    create: true
    slug: "{{slug}}"
    extension: "html"
    path: "{{slug}}/index"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "İçerik", name: "body", widget: "code", default_language: "html"}
